services:
  # API FastAPI
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mspr_api
    ports:
      - "${API_HOST_PORT:-8001}:8001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    depends_on:
      - etl
    networks:
      - mspr_network
    restart: unless-stopped

  # Interface web Next.js
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mspr_web
    ports:
      - "${WEB_PORT:-8000}:3000"
    environment:
      # DNS Docker interne : fonctionne sur Linux et Windows
      - API_URL=http://mspr_api:8001
      - ML_API_URL=http://mspr_ml_service:8000
    depends_on:
      - api
      - ml_service
    networks:
      - mspr_network
    restart: unless-stopped

  # Microservice IA pour recommandations diététiques
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: mspr_ml_service
    ports:
      - "${ML_PORT:-8003}:8000"
    environment:
      - ML_DATASET_PATH=/app/data/diet_recommendations_dataset.csv
      - ML_TRAIN_TOKEN=${ML_TRAIN_TOKEN:-}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - HUGGINGFACE_MODEL=${HUGGINGFACE_MODEL:-mistralai/Mistral-7B-Instruct-v0.2}
    volumes:
      - ./ml_service:/app
      - ./etl/data:/app/data
    depends_on:
      - etl
    networks:
      - mspr_network
    restart: unless-stopped

  # Service ETL
  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: mspr_etl
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
      - ETL_SCHEDULE=${ETL_SCHEDULE:-0 2 * * 1}
    volumes:
      - ./etl:/app
      - ./etl/data:/app/data
      - ./etl/logs:/app/logs
    command: python scheduler.py
    networks:
      - mspr_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: mspr_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mspr_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mspr_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - mspr_network
    restart: unless-stopped

networks:
  mspr_network:
    driver: bridge

volumes:
  etl_data:
    driver: local
  grafana_data:
    driver: local
