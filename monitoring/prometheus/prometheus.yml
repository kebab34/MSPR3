global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['mspr_api:8001']

  - job_name: 'ml_service'
    static_configs:
      - targets: ['mspr_ml_service:8000']

  - job_name: 'social_api'
    static_configs:
      - targets: ['mspr_social_api:8002']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
