# Configuration OFFLINE — Mode dégradé sans connexion internet
# Usage : docker compose -f docker-compose.offline.yml up -d
#
# Différences vs configuration complète :
#   - ml_service remplacé par mock_ml (réponses statiques, pas de HuggingFace)
#   - ETL désactivé (pas de Kaggle, données statiques pré-chargées)

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mspr_api
    ports:
      - "${API_HOST_PORT:-8001}:8001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost}
      - SUPABASE_KEY=${SUPABASE_KEY:-offline-key}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-offline-key}
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-offline-secret}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@admin.com}
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    networks:
      - mspr_network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mspr_web
    ports:
      - "${WEB_PORT:-8000}:3000"
    environment:
      - API_URL=http://mspr_api:8001
      - ML_API_URL=http://mspr_mock_ml:8000
    depends_on:
      - api
      - mock_ml
    networks:
      - mspr_network
    restart: unless-stopped

  # Mock ML : remplace HuggingFace par des réponses statiques
  mock_ml:
    build:
      context: ./mock_ml
      dockerfile: Dockerfile
    container_name: mspr_mock_ml
    ports:
      - "${ML_PORT:-8003}:8000"
    networks:
      - mspr_network
    restart: unless-stopped

  social_api:
    build:
      context: ./social_api
      dockerfile: Dockerfile
    container_name: mspr_social_api
    ports:
      - "${SOCIAL_PORT:-8002}:8002"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost}
      - SUPABASE_KEY=${SUPABASE_KEY:-offline-key}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-offline-key}
      - JWT_SECRET=${JWT_SECRET:-offline-secret}
    volumes:
      - ./social_api:/app
    networks:
      - mspr_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: mspr_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mspr_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mspr_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - mspr_network
    restart: unless-stopped

networks:
  mspr_network:
    driver: bridge

volumes:
  grafana_data:
    driver: local
